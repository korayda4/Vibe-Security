name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vibe Security
        run: npm install -g vibe-security

      - name: First run - establish baseline (only on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          vibe-security scan . --update-baseline --no-fail || true

      - name: Scan and report new findings
        run: |
          vibe-security scan . \
            --format sarif \
            --output vibe-security.sarif \
            --baseline .vibe-security-baseline.json \
            --no-fail

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: vibe-security.sarif

      - name: Upload Security.md
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: Security.md
